name: Build and Push Story Docker Image

on:
  push:
    tags:
      - "story-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag/ref to build (e.g. v1.7.0)'
        required: false
        default: ''

env:
  REGISTRY: ${{ vars.KCR_REGISTRY }}
  IMAGE_NAME: cosmos/cosmos-heighliner
  INFRA_TOOLKIT: v0.1.6

jobs:
  build-and-push-story:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5

      - name: Set up Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495
        with:
          go-version: '1.26'

      - name: Log in to the Container registry
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.KCR_USERNAME }}
          password: ${{ secrets.KCR_TOKEN }}

      - name: Build Heighliner binary
        run: |
          go build -o heighliner

      - name: Extract version from tag or input
        id: extract_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/story-}" >> $GITHUB_ENV
          fi

      - name: Manually pull the base Docker image
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/p2p-org/cosmos-heighliner:infra-toolkit-${{ env.INFRA_TOOLKIT }}

      - name: Build and push story Docker image
        run: |
          ./heighliner build -c story --git-ref ${{ env.VERSION }}

      - name: Tag and push Docker image
        run: |
          docker tag story:${{ env.VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:story-${{ env.VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:story-${{ env.VERSION }}
