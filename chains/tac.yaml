# Tac Chain
- name: tac
  github-organization: TacBuild
  github-repo: tacchain
  dockerfile: cargo
  #build-target: make install
  build-env:
    - LEDGER_ENABLED=false
  pre-build: |
   wget https://github.com/TacBuild/tacchain/releases/download/${VERSION}/tacchaind-linux-amd64
   mkdir -p /go/bin
   mv tacchaind-linux-amd64 /go/bin/tacchaind 
   chmod +x /go/bin/tacchaind
  binaries:
    - /root/go/bin/tacchaind
